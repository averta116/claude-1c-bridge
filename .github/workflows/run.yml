name: 1C OData Sync Cron

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 1C OData Sync
        env:
          ODATA_URL: ${{ secrets.ODATA_URL }}
          ODATA_USER: ${{ secrets.ODATA_USER }}
          ODATA_PASSWORD: ${{ secrets.ODATA_PASSWORD }}
        run: python sync_1c.py

      - name: Commit export
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_export/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync 1C metadata [skip ci]" && git push)
