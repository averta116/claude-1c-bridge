name: 1C OData Sync Cron

on:
  schedule:
    - cron: "0 */6 * * *"  # запуск каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write  # дает право сохранять файлы обратно в репозиторий

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Run 1C OData Sync
        env:
          ODATA_URL: ${{ secrets.ODATA_URL }}
          ODATA_USER: ${{ secrets.ODATA_USER }}
          ODATA_PASSWORD: ${{ secrets.ODATA_PASSWORD }}
        run: python sync_1c.py

      - name: Commit export
        run: |
          git config user.name "1c-sync-bot"
          git config user.email "1c-sync-bot@users.noreply.github.com"
          git add data_export
          git diff --cached --quiet || git commit -m "1C export $(date -u +'%Y-%m-%d %H:%M')"
          git push
