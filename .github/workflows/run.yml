name: 1C OData Sync Cron

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run 1C OData Sync
        env:
          ODATA_URL: ${{ secrets.ODATA_URL }}
          ODATA_USER: ${{ secrets.ODATA_USER }}
          ODATA_PASSWORD: ${{ secrets.ODATA_PASSWORD }}
        run: python sync_1c.py

      - name: Commit export
        run: |
          git config --global user.name "1c-sync-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add data_export/
          git diff --cached --quiet || git commit -m "1C export $(date -u +'%Y-%m-%d %H:%M')"
          git push origin main --force
